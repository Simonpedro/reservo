app = "reservo"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "node ace migration:run --force"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  NODE_ENV = "production"
  LOG_LEVEL = "info"
  SESSION_DRIVER = "cookie"
  APP_BASE_DOMAIN = "reservo.fit"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
